name: Reusable CI

on:
  workflow_call:

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx tsc --noEmit

      - run: pnpm run lint

      - run: pnpm test

      - run: npx publint

      - run: npm pack --dry-run
