name: Reusable CI

on:
  workflow_call:

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx tsc --noEmit

      - run: pnpm run lint

      - run: pnpm test

      - run: npx publint

      - run: npx attw --pack . --profile node16

      # `pnpm install` built dist via `prepare`; consume it as a user would.
      - name: ESM and CJS consumers
        run: |
          node test/consumers/esm.mjs
          node test/consumers/cjs.cjs

      # `@teslemetry/api` inlines ./tariff, so it must stay free of protobuf.
      - name: ./tariff has no tesla-protocol import
        run: "! grep -l tesla-protocol dist/tariff.*"

      - run: npm pack --dry-run

  # A matrix job reports one check per Node version, so this job keeps the
  # single "Build, Lint & Test" check that the default branch's ruleset requires.
  gate:
    name: Build, Lint & Test
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success
